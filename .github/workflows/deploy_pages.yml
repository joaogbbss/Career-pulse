name: Update CareerPulse Statistical App

on:
  schedule:
    - cron: '0 6 * * 1' # Toda segunda-feira às 06:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Statistical Stack
        run: |
          pip install numpy pandas scipy scikit-learn pyarrow

      - name: Run 6-Layer Statistical Engine & Build Web App
        run: |
          python main_pipeline.py --out web

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
